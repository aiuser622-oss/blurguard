      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Modele NudeNet vers TFLite
        working-directory: BlurGuard
        run: |
          pip install ultralytics
          curl -L -o 320n.pt https://github.com/notAI-tech/NudeNet/releases/download/v3.4-weights/320n.pt
          yolo export model=320n.pt format=tflite imgsz=320
          find . -name "*.tflite" -print
          F=$(find . -name "320n_float32.tflite" | head -n 1)
          cp "$F" app/src/main/assets/nudenet_320n.tflite
      - name: Compiler
        working-directory: BlurGuard
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlurGuard-APK
          path: BlurGuard/app/build/outputs/apk/debug/app-debug.apk
