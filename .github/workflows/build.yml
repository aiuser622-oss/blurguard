      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Modele NudeNet (ONNX)
        working-directory: BlurGuard
        run: |
          python3 -m pip download nudenet --no-deps -d /tmp/nn
          unzip -o -j /tmp/nn/nudenet-*.whl "nudenet/320n.onnx" -d app/src/main/assets
          mv app/src/main/assets/320n.onnx app/src/main/assets/nudenet_320n.onnx
          ls -la app/src/main/assets
      - name: Compiler
        working-directory: BlurGuard
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlurGuard-APK
          path: BlurGuard/app/build/outputs/apk/debug/app-debug.apk
